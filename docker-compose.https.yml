# Local HTTPS testing with the ignored self-signed localhost certificate.
# Run together with docker-compose.yml; see docs/deployment.md.
services:
  hashfork-list:
    environment:
      APP_URL: https://localhost:8443
      TRUST_PROXY: 'true'
      ENABLE_HSTS: 'false'
  https-proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8443:443'
    depends_on:
      hashfork-list:
        condition: service_healthy
    volumes:
      - ./deploy/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certificates:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true
