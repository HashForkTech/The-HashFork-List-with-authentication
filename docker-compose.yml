services:
  hashfork-list:
    build: .
    container_name: the-hashfork-list
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATA_DIR: /data
      # No password / no session secret — the admin area has no login.
      # Protect /admin and /api at the reverse proxy if this is exposed
      # (see README → "Admin area (no password)").
      # ENABLE_HSTS: 'true'   # only when serving over HTTPS
    volumes:
      # The named volume is what makes the SQLite database durable.
      # Without it, data disappears when the container is replaced.
      - hashfork-data:/data

volumes:
  hashfork-data:
