services:
  hashfork-list:
    build: .
    restart: unless-stopped
    init: true
    # Bind locally. Publish through an HTTPS reverse proxy in production.
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      APP_URL: ${APP_URL:-https://localhost:8443}
      DATABASE_PROVIDER: sqlite
      DATA_DIR: /data
      DATABASE_FILE: ${DATABASE_FILE:-hashfork.sqlite}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:?Set ADMIN_SETUP_TOKEN in .env before starting}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Set AUTH_ENCRYPTION_KEY in .env before starting}
      AUTH_SESSION_MINUTES: ${AUTH_SESSION_MINUTES:-60}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - hashfork-data:/data

volumes:
  hashfork-data:
